<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Absensi Outsourcing - Kemenhaj Jember</title>
    <!-- Google Fonts untuk font resmi Simantri (Cinzel dan Montserrat) -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Library QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
  <style>
        :root {
            --primary-color: #2b1b0c; /* Cokelat Gelap Simantri */
            --secondary-color: #d4a342; /* Gold/Emas Simantri */
            --bg-color: #f7f3eb; /* Krem Lembut Background */
            --text-color: #3e2723; /* Teks Cokelat Tua */
            --success-color: #1b5e20;
            --fail-color: #b71c1c;
        }

       * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Font dasar web otomatis berubah jadi Montserrat yang bersih */
            font-family: 'Montserrat', sans-serif;
        }

      body {
    background-color: var(--bg-color);
    /* Memanggil file gambar yang lo upload tadi */
    background-image: url('bg.png'); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed; /* Biar background-nya terkunci pas di-scroll */
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(43, 27, 12, 0.08);
            overflow: hidden;
            border: 2px solid rgba(212, 163, 66, 0.3);
        }

        .header {
    background: linear-gradient(135deg, #3a2510 0%, #2b1b0c 100%);
    color: #ffffff;
    text-align: center;
    /* Kita naikin padding bawah dari 25px menjadi 40px biar melar kebawah */
    padding: 15px 20px 40px 20px; 
    border-bottom: 4px solid var(--secondary-color);
}
     .logo-kemenhaj {
    width: 250px; /* Di-up ukurannya biar gak terlalu imut */
    height: auto;
    margin-bottom: -25px;
    display: inline-block;
}
        .header h1 {
            /* Font judul berubah jadi Cinzel yang ada kaki klasiknya */
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin-bottom: -1px;
        }

        .header p {
            font-size: 11px;
            color: #d4a342;
            font-weight: 600;
            /* Mengatur jarak antar huruf agar renggang elegan mirip web temen lo */
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .content {
            padding: 30px 24px;
            background: #ffffff;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2ece9;
            background-color: #faf8f5;
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(212, 163, 66, 0.15);
        }

        .scanner-section {
            border: 2px dashed #d4a342;
            border-radius: 16px;
            padding: 15px;
            background: #fdfbf7;
            text-align: center;
            margin-bottom: 25px;
        }

        #reader {
            width: 100%;
            border: none !important;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Tombol Request Kamera bertema Gold */
        #reader button {
            background: linear-gradient(135deg, #e5b352 0%, #d4a342 100*) !important;
            color: #2b1b0c !important;
            border: none !important;
            padding: 12px 24px !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            box-shadow: 0 4px 12px rgba(212, 163, 66, 0.2) !important;
            transition: all 0.2s !important;
            margin-top: 10px !important;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #reader button:hover {
            background: #2b1b0c !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(43, 27, 12, 0.2) !important;
        }

        #status {
            display: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            line-height: 1.4;
            animation: fadeInUp 0.3s ease;
        }

        .sukses {
            background-color: #e8f5e9;
            color: var(--success-color);
            border: 1px solid #c8e6c9;
        }

        .gagal {
            background-color: #ffebee;
            color: var(--fail-color);
            border: 1px solid #ffcdd2;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #8d7d70;
            background: #2b1b0c;
            color: #eadecc;
            border-top: 2px solid var(--secondary-color);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bagian Atas / Kop Aplikasi -->
        <div class="header">
    <!-- Jika nama file yang lo upload tadi adalah logo.png -->
<img src="kemenhajpremium.png.png" alt="Logo Kemenhaj" class="logo-kemenhaj">
    <h1>E-ABSENSI OUTSOURCING</h1>
    <p>Kemenhaj Kabupaten Jember</p>
</div>

        <!-- Bagian Input & Kamera -->
        <div class="content">
            <!-- Dropdown Nama Pegawai Outsourcing -->
<div class="form-group">
  <label for="namaPegawai"><b>Nama Pegawai:</b></label>
  <select id="namaPegawai" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc;">
    <option value="">-- Pilih Nama Anda --</option>
    <option value="Moh. Hilmi Mas'ud">Moh. Hilmi Mas'ud</option>
    <option value="Dwi Fajrul Toyyibin">Dwi Fajrul Toyyibin</option>
    <option value="Mujib Abdurrohman">Mujib Abdurrohman</option>
    <option value="Wahyu Veriansyah">Wahyu Veriansyah</option>
    <option value="Siti Nurpadilah">Siti Nurpadilah</option>
  </select>
</div>

<!-- Opsi Opsi Jenis Absen -->
<div class="form-group" style="margin-top: 15px;">
  <label style="display: block; margin-bottom: 12px; text-align: left;"><b>OPSI ABSEN / IZIN:</b></label>

  <!-- Opsi 1: Hadir -->
  <label for="modeHadir" style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; cursor: pointer;">
    <span style="font-size: 14px; font-weight: bold;">HADIR (SCAN DI KANTOR)</span>
    <input type="radio" id="modeHadir" name="modeAbsen" value="HADIR" checked onclick="toggleAlasan()" style="accent-color: #d4af37; margin: -137px; cursor: pointer;">
  </label>

  <!-- Opsi 2: Izin Datang Telat -->
  <label for="modeIzinTelat" style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; cursor: pointer;">
    <span style="font-size: 14px; font-weight: bold;">IZIN DATANG TELAT</span>
    <input type="radio" id="modeIzinTelat" name="modeAbsen" value="IZIN_TELAT" onclick="toggleAlasan()" style="accent-color: #d4af37; margin: -137px; cursor: pointer;">
  </label>

  <!-- Opsi 3: Izin Tidak Masuk -->
  <label for="modeIzinAbsen" style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; cursor: pointer;">
    <span style="font-size: 14px; font-weight: bold;">IZIN TIDAK MASUK (BISA DARI RUMAH)</span>
    <input type="radio" id="modeIzinAbsen" name="modeAbsen" value="IZIN_TIDAK_MASUK" onclick="toggleAlasan()" style="accent-color: #d4af37; margin: -113px; cursor: pointer;">
  </label>
</div>

<!-- Kotak Alasan Opsional -->
<div id="boxAlasan" style="display: none; margin-top: 10px;">
  <label for="alasan"><b>Alasan Izin (Opsional):</b></label>
  <textarea id="alasan" rows="2" style="width: 100%; padding: 8px;" placeholder="Tuliskan alasan jika ada..."></textarea>
</div>

<button type="button" onclick="kirimIzin()" style="margin-top: 10px; width: 100%; padding: 12px; background-color: #d4af37; color: #1a1a1a; font-weight: bold; border: none; border-radius: 5px; cursor: pointer;">
  Kirim Izin (Tanpa Scan Barcode)
</button>
<script>
  function toggleAlasan() {
    const isHadir = document.getElementById("modeHadir").checked;
    document.getElementById("boxAlasan").style.display = isHadir ? "none" : "block";
  }
</script>

            <div class="form-group">
                <label>Scan QR Code Resmi Kantor</label>
                <div class="scanner-section">
                    <div id="reader"></div>
                </div>
            </div>

            <!-- Tempat memunculkan notifikasi -->
            <div id="status"></div>
        </div>

        <!-- Bagian Bawah -->
        <div class="footer">
            &copy; 2026 Kemenhaj Jember Ekosistem terintegrasi
        </div>
    </div>

    <!-- Hubungkan ke script logika kita -->
    <script src="script.js"></script>
</body>
</html>

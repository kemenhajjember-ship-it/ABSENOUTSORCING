<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Absensi Outsourcing Kemenhaj Jember</title>
    <!-- Library QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c221e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .container {
            background-color: #3d312a;
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header img {
            width: 80px;
        }
        .header h2 {
            font-size: 18px;
            color: #d4af37;
            margin: 10px 0 5px 0;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 12px;
            margin: 0;
            color: #cccccc;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #d4af37;
        }
        select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            background-color: #ffffff;
            color: #333333;
            box-sizing: border-box;
            font-size: 14px;
        }
        .radio-group {
            background: #2c221e;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #555;
            font-size: 13px;
        }
        .radio-group label {
            display: inline;
            color: #fff;
            margin-left: 5px;
        }
        #reader {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
        }
        #status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
        }
        .sukses { background-color: #d4edda; color: #155724; }
        .gagal { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- Pastikan file logo.png ada di folder repository github lo -->
        <img src="logo.png" alt="Logo Kemenhaj" onerror="this.style.display='none'">
        <h2>E-ABSENSI OUTSOURCING</h2>
        <p>KEMENHAJ KABUPATEN JEMBER</p>
    </div>

    <!-- 1. Dropdown Nama Pegawai -->
    <div class="form-group">
        <label for="namaPegawai"><b>NAMA LENGKAP PEGAWAI</b></label>
        <select id="namaPegawai">
            <option value="">-- Pilih Nama Anda --</option>
            <!-- Isi nama sementara, nanti bisa lo tambahin sesuai daftar asli -->
            <option value="Ahmad Sukron">Ahmad Sukron</option>
            <option value="Budi Santoso">Budi Santoso</option>
            <option value="Ilmi">Ilmi</option>
            <option value="Pegawai 4">Pegawai 4</option>
        </select>
    </div>

    <!-- 2. Opsi Absen / Izin -->
    <div class="form-group">
        <label><b>OPSI ABSENSI</b></label>
        <div class="radio-group">
            <input type="radio" id="modeHadir" name="modeAbsen" value="HADIR" checked onclick="toggleAlasan()">
            <label for="modeHadir">Hadir (Scan Kantor)</label><br><br>
            
            <input type="radio" id="modeIzinTelat" name="modeAbsen" value="IZIN_TELAT" onclick="toggleAlasan()">
            <label for="modeIzinTelat">Izin Datang Telat</label><br><br>
            
            <input type="radio" id="modeIzinAbsen" name="modeAbsen" value="IZIN_TIDAK_MASUK" onclick="toggleAlasan()">
            <label for="modeIzinAbsen">Izin Tidak Masuk (Dari Rumah)</label>
        </div>
    </div>

    <!-- 3. Kotak Alasan Opsional (Muncul kalau pilih Izin) -->
    <div class="form-group" id="boxAlasan" style="display: none;">
        <label for="alasan"><b>ALASAN IZIN (OPSIONAL)</b></label>
        <textarea id="alasan" rows="2" placeholder="Contoh: Ban bocor / Sakit flu..."></textarea>
    </div>

    <!-- 4. Area Scanner QR -->
    <label style="text-align: center; margin-top: 15px;"><b>SCAN QR CODE RESMI KANTOR</b></label>
    <div id="reader"></div>

    <!-- 5. Notifikasi Status -->
    <div id="status"></div>
</div>

<script>
    function toggleAlasan() {
        const isHadir = document.getElementById("modeHadir").checked;
        document.getElementById("boxAlasan").style.display = isHadir ? "none" : "block";
    }
</script>

<!-- Script Logika Absensi -->
<script src="script.js"></script>
</body>
</html>
